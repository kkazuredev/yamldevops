trigger: none

pool:
  vmImage: 'ubuntu-latest'


variables:
  resourceGroupName: 'yaml-rg'
  location: 'eastus'
  storageAccountName: 'yamlsg2026'
  sku: 'Standard_LRS'
  vmName: 'yaml-vm'
  

steps:
  - task: AzureCLI@2
    displayName: 'deleting resources'
    inputs:
      azureSubscription: 'devops-sub'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        echo "deleting resources: ${{ variables.resourceGroupName }}..."
        az group delete --name ${{ variables.resourceGroupName}} --yes --no-wait
